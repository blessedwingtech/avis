<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient (Emerald Luxury) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006039" />
      <stop offset="100%" stop-color="#00331e" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Shading Gold facet -->
    <linearGradient id="goldFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1" />

  <!-- Base 5-Point Luxury Star -->
  <path d="M16 4.5 L19.4 11.8 L27.4 12.8 L21.5 18.3 L23.1 26.2 L16 22.2 L8.9 26.2 L10.5 18.3 L4.6 12.8 L12.6 11.8 Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)" />

  <!-- Facet effect for high-end dimensional look -->
  <path d="M16 4.5 L16 22.2 L8.9 26.2 L10.5 18.3 L4.6 12.8 L12.6 11.8 Z" 
        fill="url(#goldFacet)" 
        fill-opacity="0.4" />
</svg>
