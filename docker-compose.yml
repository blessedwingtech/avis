services:
  db:
    image: postgres:15-alpine
    container_name: avis_hub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bentzisblessedbythelord}
      POSTGRES_DB: avis_bittonik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432" # Use 5434 on host to avoid conflict
    volumes:
      - avis_hub_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avis_hub_app
    restart: always
    ports:
      - "3006:3000" # Expose app on port 3006
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-bentzisblessedbythelord}@db:5432/avis_bittonik?schema=public
      - NEXT_PUBLIC_AVIS_HUB_URL=https://avis.bittonik.com
    depends_on:
      db:
        condition: service_healthy
    # On boot, push DB schema using local prisma binary and start app
    command: sh -c "./node_modules/.bin/prisma db push && node server.js"

volumes:
  avis_hub_pgdata:
