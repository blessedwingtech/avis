services:
  db:
    image: postgres:15-alpine
    container_name: avis_hub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bentzisblessedbythelord}
      POSTGRES_DB: avis_bittonik
    ports:
      - "5434:5432" # Use 5434 on host to avoid conflict
    volumes:
      - avis_hub_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avis_hub_app
    restart: always
    ports:
      - "3006:3000" # Expose app on port 3006
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-bentzisblessedbythelord}@db:5432/avis_bittonik?schema=public
      - NEXT_PUBLIC_AVIS_HUB_URL=https://avis.bittonik.com
    depends_on:
      - db
    # On boot, wait a bit for db readiness and push DB schema using local prisma binary
    command: sh -c "sleep 3 && ./node_modules/.bin/prisma db push && node server.js"

volumes:
  avis_hub_pgdata:
