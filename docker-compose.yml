version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: avis_hub_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bentzisblessedbythelord}
      POSTGRES_DB: avis_bittonik
    ports:
      - "5433:5432" # Use 5433 on host to avoid conflict if 5432 is in use
    volumes:
      - avis_hub_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avis_hub_app
    restart: always
    ports:
      - "3005:3000" # Expose app on port 3005 (or another available port)
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-bentzisblessedbythelord}@db:5432/avis_bittonik?schema=public
      - NEXT_PUBLIC_AVIS_HUB_URL=https://avis.bittonik.com
    depends_on:
      - db
    # On boot, wait a bit and push DB schema
    command: sh -c "npx prisma db push && node server.js"

volumes:
  avis_hub_pgdata:
